name: HamGNN-oeq
channels:
  # Keep the same channel order as the standard HamGNN environment.
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch/
  - nvidia
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/
dependencies:
  # OpenEquivariance requires Python >= 3.10 and a C++ compiler.
  - python=3.10
  - pip
  - gcc=12
  - gxx=12
  - cmake=3.26
  - ninja
  - libgcc-ng=12
  - libstdcxx-ng=12

  # PyTorch/CUDA stack used by the HamGNN training environment.
  - pytorch=2.5.0
  - torchvision=0.20.0
  - torchaudio=2.5.0
  - pytorch-cuda=12.1

  # HamGNN runtime dependencies.
  - natsort
  - numba
  - pytorch-lightning=1.5.10
  - nequip
  - e3nn=0.5.0
  - ase
  - pymatgen
  - numpy
  - scipy
  - scikit-learn
  - sympy=1.13.1
  - pyyaml
  - tqdm
  - easydict
  - prettytable
  - packaging
  - opt_einsum
  - matplotlib
  - pandas
  - jupyterlab

  - pip:
      # PyG wheels matching PyTorch 2.5 and CUDA 12.1.
      - -f https://data.pyg.org/whl/torch-2.5.0+cu121.html
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2+pt25cu121
      - torch-sparse==0.6.18+pt25cu121
      - torch-runstats
      - torch-ema
      - torch-dftd
      - opt_einsum_fx
      - tensorboard
      - lmdb

      # Optional CUDA tensor-product backend used by PR #110.
      - openequivariance==0.6.5
